[package]
name = "ihost"
version = "0.8.1"
authors = ["thewawar <thewawar@gmail.com>"]
license = "MIT"
description = "Share a folder over HTTP with this machine or other devices on the network"
readme = "README.md"
keywords = ["http", "server", "static", "file-sharing", "lan"]
repository = "https://github.com/Khaled-Ghallab/ihost"
edition = "2024"

[features]
default = []
tls = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
anstream = "1.0.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "color"] }
flate2 = "1.1.11"
http-body = "1.1.0"
httpdate = "1.0.3"
mime_guess = "2.0.5"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "io-util", "time", "sync"] }
tokio-openssl = { version = "0.6.5", optional = true }

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10.82", optional = true }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.82", optional = true, features = ["vendored"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
